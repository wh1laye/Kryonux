# Kryonux Package Manager Repositories Configuration
# Each repository on its own line: name = path_or_url

# Main Kryonux overlay
kryounix = /kpkg/overlay

# External recipes repository (can be local path or git URL)
# To use from GitHub:
# kpkg-recipes = https://github.com/wh1laye/kpkg-recipes.git
#
# To use local path:
kpkg-recipes = /var/db/kpkg/recipes
