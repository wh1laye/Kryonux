name: kryonk-boot

on:
  workflow_dispatch:
    inputs:
      kryonk_version:
        description: версия ядра kryonk из релиза kryonk-<версия>
        default: "0.0.1"
      kernel:
        description: версия ванильного ядра
        default: "6.18.10"
      march:
        description: микроархитектура
        default: x86-64-v3
        type: choice
        options:
          - x86-64
          - x86-64-v3

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: загрузка релиза
        env:
          GH_TOKEN: ${{ github.token }}
          CVER: ${{ inputs.kryonk_version }}
          MARCH: ${{ inputs.march }}
        run: |
          case "$CVER" in ''|*[!0-9A-Za-z._]*) echo "::error::неверная версия kryonk"; exit 1 ;; esac
          mkdir -p rel
          gh release download "kryonk-$CVER" -p "kryonk-$CVER-$MARCH*" -D rel
          ( cd rel && sha256sum -c "kryonk-$CVER-$MARCH.sha256" )
          ls -lh rel
          if [ -f "rel/kryonk-$CVER-$MARCH-missing.txt" ]; then echo "--- необязательные опции, которые не встали ---"; cat "rel/kryonk-$CVER-$MARCH-missing.txt"; fi

      - name: загрузка ядра в qemu
        env:
          CVER: ${{ inputs.kryonk_version }}
          KVER: ${{ inputs.kernel }}
          MARCH: ${{ inputs.march }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86
          bash tools/kernel/boot-check.sh "rel/kryonk-$CVER-$MARCH-vmlinuz" "$KVER-kryonk-$CVER"
