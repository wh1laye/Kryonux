name: kryonk

on:
  workflow_dispatch:
    inputs:
      kver:
        description: kernel version, empty means latest
        required: false
        default: ""
        type: string
      ver:
        description: kryonk release version
        required: false
        default: "0.0.1"
        type: string

permissions:
  contents: write

concurrency:
  group: kryonk
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        march: [x86-64, x86-64-v3]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison bc libelf-dev libssl-dev \
            zstd patch git curl tar xz-utils gpg minisign shellcheck
      - name: shell syntax
        run: |
          find tools -name '*.sh' -print0 | xargs -0 -r bash -n
          find tools -name '*.sh' -print0 | xargs -0 -r shellcheck -S error
      - name: signing key
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          KRYONK_SIGNING_KEY: ${{ secrets.KRYONK_SIGNING_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/kryonk.key"
          elif [ -n "$KRYONK_SIGNING_KEY" ]; then
            printf '%s' "$KRYONK_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/kryonk.key"
          else
            echo "::error::MINISIGN_KEY или KRYONK_SIGNING_KEY не задан, сборка без подписи запрещена"
            exit 1
          fi
          chmod 600 "$RUNNER_TEMP/kryonk.key"
          echo "SIGN_KEY=$RUNNER_TEMP/kryonk.key" >> "$GITHUB_ENV"
      - name: build kryonk
        env:
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          JOBS=$(nproc) MARCH=${{ matrix.march }} \
          KRYONK_VER=${{ inputs.ver }} KVER="${{ inputs.kver }}" \
          OUT="$GITHUB_WORKSPACE/out" \
          MINISIGN_KEY="${SIGN_KEY:-}" MINISIGN_PASSWORD="$MINISIGN_PASSWORD" \
          bash tools/kernel/build-kryonk.sh
      - name: проверка суммы и подписи
        run: |
          cd out
          sha256sum -c kryonk-*.sha256
          for x in kryonk-*.sha256; do
            [ -s "$x.minisig" ] || { echo "::error::нет подписи $x.minisig"; exit 1; }
            minisign -V -p "$GITHUB_WORKSPACE/docs/kryonux.pub" -m "$x" -x "$x.minisig"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: kryonk-${{ inputs.ver }}-${{ matrix.march }}
          path: out/
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: kryonk-${{ inputs.ver }}
          files: out/*
